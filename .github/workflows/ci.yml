name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy modules
        run: go mod tidy

      - name: Check module files are tidy
        run: git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: |
          unformatted="$(find . -name '*.go' -not -path './vendor/*' -print0 | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Run race tests
        run: go test -race ./...

  backend-homework05:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/homework05
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/homework05/go.mod
          cache: true
          cache-dependency-path: backend/homework05/go.sum

      - name: Resolve module dependencies
        run: go mod tidy

      - name: Check module files are tidy
        run: git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: |
          unformatted="$(find . -name '*.go' -print0 | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build homework CLI
        run: go build -o /tmp/metanode-homework05 ./cmd/homework05

  solidity-homework01-02:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solidity/homework-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: solidity/homework-tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run homework01/02 tests
        run: npm test

  solidity-homework03:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solidity/homework03
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Compile homework03
        run: npm run compile

      - name: Run homework03 tests
        run: npm test
