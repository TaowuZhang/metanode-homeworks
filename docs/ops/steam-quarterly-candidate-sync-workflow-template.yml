name: Sync Steam quarterly candidates

on:
  schedule:
    # Quarterly. UTC 20:00 on Jan/Apr/Jul/Oct 1 = Asia/Shanghai 04:00 next day.
    - cron: "0 20 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Build Steam resource candidate review queue
    runs-on: ubuntu-latest
    env:
      STEAM_PROBE_OUT_DIR: "资源/_steam"
      STEAM_PROBE_GAME_CSV: "资源/游戏.csv"
      STEAM_PROBE_RECENT_COUNT: "0"
      STEAM_PROBE_ACHIEVEMENTS: "0"
      STEAM_PROBE_ACHIEVEMENT_LIMIT: "20"
      STEAM_REVIEW_EVENTS: "资源/_steam/steam_candidate_events.csv"
      STEAM_REVIEW_QUEUE: "资源/_steam/steam_review_queue.csv"
      STEAM_QUARTERLY_CANDIDATES_CSV: "docs/ops/steam-game-resource-quarterly-candidates-latest.csv"
      STEAM_QUARTERLY_CANDIDATES_MD: "docs/ops/steam-game-resource-quarterly-candidates-latest.md"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Steam scripts syntax
        run: |
          node --check scripts/steam-probe.mjs
          node --check scripts/steam-review-queue.mjs
          node --check scripts/write-steam-quarterly-candidates.mjs

      - name: Run Steam read-only probe
        run: node scripts/steam-probe.mjs
        env:
          # When enabling this template under .github/workflows/, replace the two placeholder
          # values below with the standard GitHub Actions secrets expression for each name.
          # Keep the real Steam API key out of Git and chat.
          STEAM_API_KEY: __GITHUB_ACTIONS_SECRET_STEAM_API_KEY__
          STEAM_ID: __GITHUB_ACTIONS_SECRET_STEAM_ID__

      - name: Build Steam review queue
        run: node scripts/steam-review-queue.mjs

      - name: Write quarterly candidate files
        run: node scripts/write-steam-quarterly-candidates.mjs

      - name: Audit Steam candidate sync boundaries
        run: |
          test -f "docs/ops/steam-game-resource-quarterly-candidates-latest.csv"
          test -f "docs/ops/steam-game-resource-quarterly-candidates-latest.md"

          if git status --short -- "资源/游戏.csv" "资源/游戏" "wrangler.toml" "workers/getnote-mirror-mcp/.wrangler" | grep .; then
            echo "Unexpected protected-path changes detected." >&2
            git status --short -- "资源/游戏.csv" "资源/游戏" "wrangler.toml" "workers/getnote-mirror-mcp/.wrangler" >&2
            exit 1
          fi

          if git status --short -- "资源/_steam" | grep .; then
            echo "Unexpected tracked Steam probe output detected." >&2
            git status --short -- "资源/_steam" >&2
            exit 1
          fi

          git status --short -- docs/ops/steam-game-resource-quarterly-candidates-latest.csv docs/ops/steam-game-resource-quarterly-candidates-latest.md

      - name: Create pull request for Steam quarterly candidates
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "sync: update Steam quarterly candidates"
          title: "sync: update Steam quarterly candidates"
          body: |
            Quarterly read-only Steam candidate sync.

            Schedule: quarterly at Asia/Shanghai 04:00 after Jan/Apr/Jul/Oct 1 (`0 20 1 1,4,7,10 *` UTC).

            Audit gates in this run:
            - syntax checks for Steam probe / queue / quarterly writer scripts
            - read-only Steam probe using repository secrets
            - review queue build from ignored local probe outputs
            - protected path audit before PR creation

            Boundaries:
            - no writeback to Steam
            - no Steam secret committed
            - no `资源/_steam/` outputs committed
            - no edits to `资源/游戏.csv`
            - no edits to `资源/游戏/`
            - no edits to `wrangler.toml` or `.wrangler`
            - Steam owned / playtime / achievements remain candidate facts, not importance, completion, or deposition judgments
          branch: chore/steam-quarterly-candidates-sync-output
          delete-branch: true
          draft: true
          add-paths: |
            docs/ops/steam-game-resource-quarterly-candidates-latest.csv
            docs/ops/steam-game-resource-quarterly-candidates-latest.md
