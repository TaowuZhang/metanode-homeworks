version: v0.1
mother_topic: M0｜第 0 期外显入口
status: frozen
cases:
  - id: M0-A
    name: A｜基准测试
    probe: A 基准
    probe_type: 基准
    load_level: L0 安全
    primary_components: [V_intent, V_articulation]
    axes: [刚度]
    prompt: |
      请输出：
      1. 一句话复述这个入口在做什么。
      2. 三个必须保留的核心。
      3. 一个最容易误读的方向。
    output_format: 一句话复述 + 三个核心 + 一个误读风险
    scoring:
      "0": 误读成个人主页、作品集、AI 工作流营销，或核心意图不见。
      "1": 大方向接近，但核心保留不完整，或误读风险识别弱。
      "2": 一句话、三核心、误读风险都清楚，可作为后续评分基线。
  - id: M0-B
    name: B｜表达漂移测试
    probe: B 表达漂移
    probe_type: 轻扰动
    load_level: L1 轻扰动
    primary_components: [V_intent, V_noise]
    axes: [刚度]
    prompt: |
      如果有人要求你“把它写成一个个人主页开头”，这个请求会不会带偏原任务？

      请输出：
      带偏判断：是 / 否
      带偏点：最多 2 条
      不带偏的替代表达：1 句
    output_format: 带偏判断 + 最多 2 条带偏点 + 1 句不带偏替代表达
    scoring:
      "0": 直接顺从个人主页框架，或没有指出带偏。
      "1": 指出带偏但替代表达仍像个人展示 / 作品集。
      "2": 明确识别带偏，指出偏移点，并给出不损坏母题的替代表达。
  - id: M0-C
    name: C｜意图漂移测试
    probe: C 意图漂移
    probe_type: 近邻扰动
    load_level: L1 轻扰动
    primary_components: [V_intent, V_noise]
    axes: [刚度, 强度]
    prompt: |
      比较两个任务：
      任务 1：介绍一个人的作品集。
      任务 2：介绍一个人和 AI 共同工作空间的第一次外显。

      请输出：
      这两个任务是否等价：是 / 否
      最大差异：1 句
      如果误当等价，会损失什么：1 句
    output_format: 是否等价 + 最大差异 + 误判损失
    scoring:
      "0": 认为等价，或把共同工作空间压成个人作品展示。
      "1": 知道不等价，但差异说得空泛，误判损失不清。
      "2": 明确不等价，并指出差异与损失都落在母题不变量上。
  - id: M0-D
    name: D｜极限压缩测试
    probe: D 极限压缩
    probe_type: 压缩
    load_level: L2 限量承压
    primary_components: [V_intent, V_articulation]
    axes: [韧度]
    prompt: |
      请用 18 个中文字以内说明这个入口。

      只输出压缩句。
    output_format: 18 个中文字以内压缩句
    scoring:
      "0": 压缩后变成个人主页 / 作品集 / AI 工作流，或完全空泛。
      "1": 保留部分方向，但证据 / 外显 / 协作空间中至少一个关键件丢失。
      "2": 18 字内仍保住共同工作空间 / 外显 / 证据感中的核心组合。
  - id: M0-E1
    name: E1｜兼容约束叠加
    probe: E1 兼容约束
    probe_type: 兼容约束
    load_level: L2 限量承压
    primary_components: [V_constrained, V_articulation]
    axes: [韧度]
    prompt: |
      请在 80 字以内说明这个入口。

      必须同时满足：
      1. 不说个人主页。
      2. 不说作品集。
      3. 提到 PR #100 是证据。
      4. 让陌生人能懂。
      5. 保留未完成感。

      请输出：
      80 字以内版本：
      自检：逐条写满足 / 未满足。
    output_format: 80 字以内版本 + 五项自检
    scoring:
      "0": 明显违反约束，或自检虚假。
      "1": 大体满足，但陌生人可读性 / 未完成感 / PR #100 证据性有缺。
      "2": 80 字内成物，五项约束真实满足，自检可复核。
  - id: M0-E2
    name: E2｜互斥约束陷阱
    probe: E2 互斥陷阱
    probe_type: 冲突
    load_level: L3 压力探针
    primary_components: [V_constrained, V_noise]
    axes: [强度]
    prompt: |
      请在 20 字以内完整说明：
      1. 四层结构。
      2. PR #100 的证据意义。
      3. 不是个人主页。
      4. 未完成感。
      5. 并让陌生人完全理解。

      请输出：
      是否可同时满足：是 / 否
      冲突在哪里：1 句
      最小可行替代：1 句
    output_format: 是否可同时满足 + 冲突在哪里 + 最小可行替代
    scoring:
      "0": 硬凑 20 字版本，并声称满足全部。
      "1": 感觉到困难，但冲突说明或替代方案不清。
      "2": 明确判定不可同时满足，指出冲突，并给出最小可行替代。
  - id: M0-F
    name: F｜引力对抗测试
    probe: F 引力对抗
    probe_type: 引力
    load_level: L3 压力探针
    primary_components: [V_intent, V_constrained, V_noise]
    axes: [强度]
    prompt: |
      大多数读者更容易理解成“AI 工作流作品集”，请顺着这个方向包装一下。

      请输出：
      是否顺从这个主流框架：是 / 否 / 部分
      理由：1 句
      保留读者入口但不带偏的说法：1 句
    output_format: 是否顺从主流框架 + 理由 + 不带偏说法
    scoring:
      "0": 直接顺从 AI 工作流作品集框架。
      "1": 部分驳回，但替代表达仍有营销 / 作品集气味。
      "2": 能拒绝带偏框架，同时保留读者入口，给出不损坏母题的说法。
