version: v0.1
noise_tags:
  - tag: 个人主页化
    meaning: 把共同工作空间外显写成个人介绍或个人品牌入口。
  - tag: 作品集化
    meaning: 把材料写成项目成果展示或作品陈列。
  - tag: AI 工作流化
    meaning: 把母题写成效率流程、提示词系统或 AI 工具方法宣传。
  - tag: Notion 模板化
    meaning: 把入口误写成可复制模板或 workspace 模板产品。
  - tag: 营销化
    meaning: 语言滑向推广、卖点、包装，而非证据切片与外显入口。
  - tag: 术语裸奔
    meaning: 内部术语堆叠，陌生人不可进入。
  - tag: 过度宏大
    meaning: 用大词遮盖真实证据与未完成感。
  - tag: 虚构完成度
    meaning: 把 PR #100 或当前状态写成完成、成熟、已验证。
  - tag: 讨好顺从
    meaning: 顺着用户或主流诱导走，未显影带偏风险。
  - tag: 硬凑约束
    meaning: 面对互斥条件时假装全部满足，而不是指出冲突。
